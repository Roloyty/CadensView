[package]
name = "cadensview"
version = "0.1.0"
edition = "2021"
description = "CadensView 二次开发 GUI：Rust/egui + FFmpeg 播放 + shotlab Python 核心"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
cpal = "0.18"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
